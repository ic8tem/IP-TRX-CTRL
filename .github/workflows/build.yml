name: Compilazione

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     hamlib: w64, arch: x64 }
          - { os: windows-latest, rid: win-x86,     hamlib: w32, arch: x86 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64 }
          - { os: ubuntu-latest,  rid: linux-arm }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: macos-latest,   rid: osx-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Hamlib per Windows (${{ matrix.hamlib }})
        if: matrix.hamlib != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get_hamlib.ps1 -Arch ${{ matrix.hamlib }}

      - name: Compila ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/IpTrxCtrl/IpTrxCtrl.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o dist/${{ matrix.rid }}

      # ---------------------------------------------------------------- Windows: Setup.exe + zip portatile
      - name: Installatore Windows
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          $src = (Resolve-Path dist/${{ matrix.rid }}).Path
          $out = (Resolve-Path out).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" "/DOutDir=$out" packaging/windows/IP-TRX-CTRL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item THIRD-PARTY-NOTICES.txt dist/${{ matrix.rid }}/
          Copy-Item LICENSE dist/${{ matrix.rid }}/LICENSE.txt
          Compress-Archive -Path dist/${{ matrix.rid }}/IP-TRX-CTRL.exe, dist/${{ matrix.rid }}/THIRD-PARTY-NOTICES.txt, dist/${{ matrix.rid }}/LICENSE.txt -DestinationPath "out/IP-TRX-CTRL-$env:VERSION-${{ matrix.rid }}-portatile.zip"
          # versione di Hamlib inclusa: serve alla release per allegare i sorgenti giusti (GPL)
          Copy-Item src/IpTrxCtrl/hamlib/VERSION.txt "out/hamlib-version-${{ matrix.hamlib }}.txt"

      # ---------------------------------------------------------------- Linux e Raspberry: .deb + tar.gz portatile
      - name: Pacchetti Linux
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          chmod +x packaging/linux/make-deb.sh
          packaging/linux/make-deb.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out
          mkdir -p pkg/IP-TRX-CTRL
          cp dist/${{ matrix.rid }}/IP-TRX-CTRL pkg/IP-TRX-CTRL/
          chmod +x pkg/IP-TRX-CTRL/IP-TRX-CTRL
          cp THIRD-PARTY-NOTICES.txt LICENSE src/IpTrxCtrl/Assets/icon.png pkg/IP-TRX-CTRL/
          tar -czf "out/IP-TRX-CTRL-$VERSION-${{ matrix.rid }}-portatile.tar.gz" -C pkg IP-TRX-CTRL
          dpkg-deb --info out/*.deb | head -20

      # ---------------------------------------------------------------- macOS: .dmg + .app zip
      - name: Pacchetti macOS
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          chmod +x packaging/macos/make-dmg.sh
          packaging/macos/make-dmg.sh ${{ matrix.rid }} "$VERSION" dist/${{ matrix.rid }} out

      - uses: actions/upload-artifact@v4
        with:
          name: IP-TRX-CTRL-${{ matrix.rid }}
          path: out/*

  # Pubblica (o aggiorna) la release della versione scritta nel file VERSION a ogni push su main.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Sorgenti di Hamlib (obbligo GPL per i rigctld inclusi negli installatori Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERS=$(cat artifacts/hamlib-version-*.txt 2>/dev/null | tr -d '\r' | sort -u)
          rm -f artifacts/hamlib-version-*.txt
          for V in $VERS; do
            [ -z "$V" ] && continue
            echo "Hamlib incluso: $V"
            URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/Hamlib/Hamlib/releases/tags/$V" \
                  | jq -r --arg n "hamlib-$V.tar.gz" '.assets[] | select(.name == $n) | .browser_download_url' || true)
            if [ -n "$URL" ]; then
              curl -fsSL -o "artifacts/hamlib-$V-sorgenti.tar.gz" "$URL"
            else
              # nessun archivio ufficiale tra i file della release: sorgenti dal tag
              curl -fsSL -o "artifacts/hamlib-$V-sorgenti.tar.gz" "https://github.com/Hamlib/Hamlib/archive/refs/tags/$V.tar.gz"
            fi
            ls -l "artifacts/hamlib-$V-sorgenti.tar.gz"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: IP-TRX-CTRL ${{ env.VERSION }}
          overwrite_files: true
          files: artifacts/*
          body: |
            **Windows 64 bit**: `IP-TRX-CTRL-…-win-x64-setup.exe` · **Windows 32 bit**: `…-win-x86-setup.exe` (Hamlib incluso)
            **Linux 64 bit**: `ip-trx-ctrl_…_amd64.deb`
            **Raspberry Pi**: `ip-trx-ctrl_…_arm64.deb` (Raspberry Pi OS 64 bit) · `ip-trx-ctrl_…_armhf.deb` (32 bit)
            **macOS**: `IP-TRX-CTRL-…-osx-arm64.dmg` (Apple Silicon) · `…-osx-x64.dmg` (Intel); al primo avvio clic destro › Apri

            Linux e Raspberry: `sudo apt install ./ip-trx-ctrl_…deb` installa anche Hamlib. Per usare la porta seriale della radio: `sudo usermod -aG dialout $USER`.
            macOS: Hamlib con `brew install hamlib`.
            Le versioni *portatile* non richiedono installazione.

            `hamlib-…-sorgenti.tar.gz`: sorgenti di Hamlib (GPL 2 / LGPL 2.1), la stessa versione di rigctld inclusa negli installatori Windows.
