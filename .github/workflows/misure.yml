# Misure di CPU e memoria (12) (non fa parte della compilazione delle release). Si avvia a mano o quando cambia questo file.
name: Misure CPU e memoria
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/misure.yml']
jobs:
  misure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Compila tre varianti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb bc > /dev/null
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) strace > /dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-generic strace > /dev/null 2>&1; sudo sysctl -w kernel.perf_event_paranoid=-1 > /dev/null
          P="dotnet publish src/IpTrxCtrl/IpTrxCtrl.csproj -c Release -r ${{ matrix.rid }} -p:Version=0.0.0"
          $P -p:EnableCompressionInSingleFile=false -o d/normale > /dev/null
          ls -la d/*/IP-TRX-CTRL | awk '{printf "%-30s %6.1f MB\n", $9, $5/1048576}'
      - name: Server senza finestra, prove a esclusione
        run: |
          mkdir -p ~/.config/IP-TRX-CTRL
          S='{"FirstRunDone":true,"DeclarationAccepted":true,"CheckUpdates":false,"AutoUpdate":false,"Role":0'
          echo "$S}" > ~/.config/IP-TRX-CTRL/settings.json
          tools/bench/misura.sh "server (tutto)" 25 d/normale/IP-TRX-CTRL --senza-finestra
          echo "$S,\"MqttBrokers\":[\"x.invalid:1\"]}" > ~/.config/IP-TRX-CTRL/settings.json
          tools/bench/misura.sh "server (senza broker)" 25 d/normale/IP-TRX-CTRL --senza-finestra
          echo "$S,\"WebEnabled\":false}" > ~/.config/IP-TRX-CTRL/settings.json
          tools/bench/misura.sh "server (senza pagina web)" 25 d/normale/IP-TRX-CTRL --senza-finestra
          echo "$S,\"WebEnabled\":false,\"MqttBrokers\":[\"x.invalid:1\"]}" > ~/.config/IP-TRX-CTRL/settings.json
          tools/bench/misura.sh "server (senza broker e web)" 25 d/normale/IP-TRX-CTRL --senza-finestra
      - name: Client con la finestra (40 s, schermo virtuale)
        run: |
          echo '{"FirstRunDone":true,"DeclarationAccepted":true,"CheckUpdates":false,"AutoUpdate":false,"Role":1}' > ~/.config/IP-TRX-CTRL/settings.json
          tools/bench/misura.sh "client con finestra (normale)" 40 xvfb-run -a d/normale/IP-TRX-CTRL
